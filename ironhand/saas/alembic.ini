# Alembic Configuration File

[alembic]
# Path to migration scripts
script_location = db/migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# max length of characters to apply to the
# "slug" field
truncate_slug_length = 40

# Version path separator; default: os.pathsep
version_path_separator = os

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# Version location specification
# version_locations = %(here)s/bar:%(here)s/bat:db/migrations/versions

# Version path separator; as specified by version_path_separator
# version_path_separator = :

# The output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

# Placeholder for database connection URL
# Actual URL loaded from config.py at runtime
sqlalchemy.url = 

[post_write_hooks]
# Format code with black after generating migration
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
