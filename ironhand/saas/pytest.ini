[pytest]
# Pytest configuration for IronHand SaaS test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Test paths
testpaths = tests

# Output options
addopts =
    # Show verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    -l
    # Strict markers - fail on unknown markers
    --strict-markers
    # Strict config - fail on unknown config options
    --strict-config
    # Show warnings
    -W default
    # Coverage report (if pytest-cov is installed)
    # --cov=ironhand
    # --cov-report=term-missing
    # --cov-report=html
    # Parallel execution (if pytest-xdist is installed)
    # -n auto

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require DB, broker mocks)
    slow: Slow tests (may take >1 second)
    asyncio: Async tests (require asyncio event loop)
    db: Tests requiring database
    broker: Tests requiring broker interaction
    critical: Critical tests for tenant isolation and security

# Asyncio configuration
asyncio_mode = auto

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    # Treat warnings as errors (strict mode)
    # error
    # Ignore specific warnings
    ignore::DeprecationWarning:ibapi.*
    ignore::PendingDeprecationWarning

# Timeout (if pytest-timeout is installed)
timeout = 300
timeout_method = thread

# Test order (if pytest-order is installed)
# Run critical tests first
# run_order = critical,unit,integration,slow

# Coverage options (if pytest-cov is installed)
[coverage:run]
source = ironhand
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false

[coverage:html]
directory = htmlcov
